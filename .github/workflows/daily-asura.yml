name: Daily Asura update
on:
  schedule:
    - cron: '0 0 * * *'
      timezone: Australia/Sydney
  workflow_dispatch:
    inputs:
      portrait_limit:
        description: 'Optional pilot episode limit; zero processes the full queue'
        required: false
        default: '0'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-asura.yml'
      - 'ops/**'
      - 'seed/titles.json'
      - 'seed/previews/**'
      - 'seed/portraits/**'
      - 'seed/portrait-exceptions.json'
      - 'seed/portrait-exclusions.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-asura-feed
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install portrait screening tools
        run: python -m pip install -r ops/requirements-previews.txt
      - name: Download integrity-checked face detector
        run: |
          curl --fail --location --retry 3 'https://huggingface.co/deepghs/anime_face_detection/resolve/main/face_detect_v1.4_s/model.onnx' -o /tmp/face.onnx
          echo '403b5bc93b6ff789b7d183418df4a1364049bac00c24acd927604a7ff6891483  /tmp/face.onnx' | shasum -a 256 -c -
      - name: Refresh and validate all registered titles
        run: python ops/refresh.py --seed seed --output _site
      - name: Generate and screen missing episode portraits
        env:
          PORTRAIT_LIMIT: ${{ inputs.portrait_limit || '0' }}
        run: python ops/automatic_feed_portraits.py --site _site --model /tmp/face.onnx --public-url https://infinity-startup.github.io/cosmos-content-feed/ --max-episodes "$PORTRAIT_LIMIT"
      - name: Save the last successful snapshot and portrait review queue
        run: |
          cp -R _site/chapters/. seed/chapters/
          cp -R _site/previews/. seed/previews/
          cp -R _site/portraits/. seed/portraits/
          cp _site/index.json _site/update-report.json _site/portrait-review-queue.json seed/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seed/previews seed/portraits seed/chapters seed/index.json seed/update-report.json seed/portrait-review-queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh daily Asura chapter feed'
            git push
          fi
          python - <<'PY'
          import json, os
          report = json.load(open('_site/update-report.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Checked {report['titlesChecked']} titles. Found {len(report['newChapters'])} new chapters. {report.get('portraitsGenerated', 0)} portraits generated automatically; {report['portraitsAwaitingReview']} remain queued.\n")
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Publish the complete feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
