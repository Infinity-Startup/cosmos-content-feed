name: Daily Asura update
on:
  schedule:
    - cron: '0 0 * * *'
      timezone: Australia/Sydney
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-asura.yml'
      - 'ops/**'
      - 'seed/titles.json'
      - 'seed/previews/**'
      - 'seed/portraits/**'
      - 'seed/portrait-exceptions.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-asura-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Refresh and validate all registered titles
        run: python ops/refresh.py --seed seed --output _site
      - name: Save the last successful snapshot and portrait review queue
        run: |
          cp -R _site/chapters/. seed/chapters/
          cp _site/index.json _site/update-report.json _site/portrait-review-queue.json seed/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seed/chapters seed/index.json seed/update-report.json seed/portrait-review-queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh daily Asura chapter feed'
            git push
          fi
          python - <<'PY'
          import json, os
          report = json.load(open('_site/update-report.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Checked {report['titlesChecked']} titles. Found {len(report['newChapters'])} new chapters. {report['portraitsAwaitingReview']} portraits await visual review.\n")
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Publish the complete feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
